  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TTS_AUDIO_DIR: /tmp/tts-audio
      PUBLIC_BASE_URL: http://localhost:8388
    volumes:
      - tts-audio:/tmp/tts-audio
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8388:8080"
    networks:
      - me_network

  worker:
    build:
      context: .
      target: ${TTS_DOCKER_TARGET:-worker}
    env_file: .env
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      TTS_AUDIO_DIR: /tmp/tts-audio
      TTS_ENGINE: ${TTS_ENGINE:-espeak}
      PUBLIC_BASE_URL: http://localhost:8388
      CHATTERBOX_DEVICE: cuda
      CHATTERBOX_REFERENCE_DIR: /app/voices
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-ai-audio}
    volumes:
      - tts-audio:/tmp/tts-audio
      - ./voices:/app/voices:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - me_network

volumes:
  redis-data:
  tts-audio:
  qdrant-data:
  #rustfs-data:
  open-webui-data:
  n8n-data:
  n8n-sandbox-tls:


networks:
  me_network:
    external: true
    name: me_network
